name: Build Ratib 3.6.100 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-release-3.6.100.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout verified official web release
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified Android build-6 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ratib-android-build6.zip 'https://github.com/SalehAliAbuBaker/Ratib0129/releases/download/v3.6.58-android.6/Ratib-Android-build6-source.zip'
          echo '7b8009d09560dcf89e3406a676f1d643945a730637e5fe131bf343a5c52e2c93 /tmp/ratib-android-build6.zip' | sha256sum --check
          mkdir -p /tmp/ratib-base
          unzip -q /tmp/ratib-android-build6.zip -d /tmp/ratib-base
          base="$(find /tmp/ratib-base -name settings.gradle -path '*/android/settings.gradle' -print -quit)"
          test -n "$base"
          cp -a "$(dirname "$base")" ./android
          test -f android/tools/bundle-web.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK requirements
        run: |
          set -euo pipefail
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          manager="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$manager"
          "$manager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set Android update number
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s,count=re.subn(r'(\bversionCode\s+)\d+', r'\g<1>8', s, count=1)
          assert count==1, 'Missing versionCode'
          s,n=re.subn(r'(\bversionName\s*(?:=\s*)?)[\x27\x22]([^\x27\x22]+)[\x27\x22]', r'\g<1>"3.6.100"', s, count=1)
          assert n==1, 'Missing versionName'
          assert re.search(r"\bapplicationId\s*(?:=\s*)?['\"]dev\.ratib\.android['\"]", s), 'Unexpected Android package'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies and run official regression checks
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node android/tests/native-bridge.cjs
          node android/tests/bundle-integrity.cjs
          node android/tests/restore-license-services.cjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Normalize and sign, if original signing key is connected
        env:
          RATIB_KEYSTORE_BASE64: ${{ secrets.RATIB_KEYSTORE_BASE64 }}
          RATIB_KEYSTORE_PASSWORD: ${{ secrets.RATIB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/build/delivery
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/build/delivery/unsigned.apk
          python3 android/tools/normalize-apk-assets.py android/build/delivery/unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 android/build/delivery/unsigned.apk android/build/delivery/aligned.apk
          if [[ -n "$RATIB_KEYSTORE_BASE64" && -n "$RATIB_KEYSTORE_PASSWORD" ]]; then
            umask 077
            printf '%s' "$RATIB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ratib-release.jks"
            printf '%s' "$RATIB_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ratib-release.txt"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/ratib-release.jks" --ks-key-alias ratib --ks-pass "file:$RUNNER_TEMP/ratib-release.txt" --out android/build/delivery/Ratib-3.6.100-Android-build8.apk android/build/delivery/aligned.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/build/delivery/Ratib-3.6.100-Android-build8.apk | tee android/build/delivery/signature.txt
            grep -qi '8bc51811b9794092f62e7d525fb80e1ece889281' android/build/delivery/signature.txt
            rm "$RUNNER_TEMP/ratib-release.jks" "$RUNNER_TEMP/ratib-release.txt"
          else
            cp android/build/delivery/aligned.apk android/build/delivery/Ratib-3.6.100-Android-build8-UNSIGNED.apk
            echo 'Original release signing secrets not available. UNVERIFIED UNSIGNED BUILD IS NOT installable or a safe update.' | tee android/build/delivery/NOTICE.txt
          fi
          for apk in android/build/delivery/Ratib-3.6.100-Android-*.apk; do
            [ -f "$apk" ] || continue
            sha256sum "$apk" >> android/build/delivery/SHA256SUMS.txt
          done

      - name: Preserve outputs without automatically publishing a release
        uses: actions/upload-artifact@v4
        with:
          name: ratib-3.6.100-android-build8
          path: |
            android/build/delivery/Ratib-3.6.100-Android-*.apk
            android/build/delivery/SHA256SUMS.txt
            android/build/delivery/NOTICE.txt
            android/build/delivery/signature.txt
          if-no-files-found: error
          retention-days: 30
