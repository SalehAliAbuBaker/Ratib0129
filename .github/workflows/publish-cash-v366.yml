name: Hotfix Ratib 3.6.6
on:
  push:
    paths:
      - tools/patch-cash-v366.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair init order
        run: python tools/patch-cash-v366.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hotfix Ratib 3.6.6 null append at startup"
          git push origin HEAD:main
