name: Prepare Ratib 3.6.209 keyboard release
on:
  push:
    branches:
      - fix/keyboard-focus-visible-20261116
    paths:
      - tools/publish-keyboard-release-20261116.py
      - .github/workflows/ratib-keyboard-release-3.6.209.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build 3.6.209 release, update offline cache and version
        run: python3 tools/publish-keyboard-release-20261116.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify all accounting and UI regressions
        run: npm test
      - name: Verify statement balances and printed output
        run: node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs
      - name: Commit verified release metadata on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js package.json test-*.cjs
          git diff --cached --quiet || git commit -m "Publish Ratib 3.6.209: keep inputs above Android keyboard"
          git push origin HEAD:fix/keyboard-focus-visible-20261116
