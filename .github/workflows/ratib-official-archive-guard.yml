name: Verify official large archive write guard

on:
  pull_request:
    paths:
      - index.html
      - test-official-archive-write-guard-20261111.cjs
      - test-backup-settings-restored-3.6.174.cjs
      - .github/workflows/ratib-official-archive-guard.yml
  workflow_dispatch:

jobs:
  archive-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install testing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test archive guard against stale-tab writes
        run: node test-official-archive-write-guard-20261111.cjs
      - name: Verify historical accounting totals and statements
        run: node test-accounting-3.6.59.cjs && node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs
