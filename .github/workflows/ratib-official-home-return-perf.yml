name: Verify official home-return paint performance

on:
  pull_request:
    paths:
      - index.html
      - sw.js
      - test-official-home-return-fast-20261111.cjs
      - .github/workflows/ratib-official-home-return-perf.yml
  workflow_dispatch:

jobs:
  home-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify home-first paint and cancellation on navigation
        run: node test-official-home-return-fast-20261111.cjs
      - name: Recheck large archive and account paging
        run: node test-official-statement-paging-20261111.cjs && node test-official-account-statement-fastlookup-20261111.cjs
      - name: Recheck accounting, statement PDF, and private archive safeguards
        run: node test-accounting-3.6.59.cjs && node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs && node test-official-archive-write-guard-20261111.cjs
