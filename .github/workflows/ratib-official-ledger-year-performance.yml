name: Verify official current-year and large statement optimizations

on:
  pull_request:
    paths:
      - index.html
      - sw.js
      - ratib-fiscal-ledger.js
      - ratib-dashboard-finance-3.6.144.js
      - test-official-20261111-ledger-year-lazy-search.cjs
      - test-official-ledger-navigation-cache-20261111.cjs
      - .github/workflows/ratib-official-ledger-year-performance.yml
  workflow_dispatch:

jobs:
  display-and-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test the current-year default, two decimal display and lazy account search
        run: node test-official-20261111-ledger-year-lazy-search.cjs && node test-official-ledger-navigation-cache-20261111.cjs
      - name: Ensure 22k ledger and archive protections still work
        run: node test-official-account-statement-fastlookup-20261111.cjs && node test-official-archive-write-guard-20261111.cjs && node test-official-recovery-stale-flush-20261111.cjs
      - name: Retest the 3.6.177 date search and financial statements
        run: node test-ledger-date-filter-3.6.177.cjs && node test-accounting-3.6.59.cjs && node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs
