name: Verify official large-account statement performance

on:
  pull_request:
    paths:
      - index.html
      - sw.js
      - test-official-account-statement-fastlookup-20261111.cjs
      - .github/workflows/ratib-official-statement-perf.yml
  workflow_dispatch:

jobs:
  statement-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test synthetic 22,100 accounting legs
        run: node test-official-account-statement-fastlookup-20261111.cjs
      - name: Recheck prior archive protection and recovery
        run: node test-official-archive-write-guard-20261111.cjs && node test-official-recovery-stale-flush-20261111.cjs
      - name: Recheck original financial calculations and statements
        run: node test-accounting-3.6.59.cjs && node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs
