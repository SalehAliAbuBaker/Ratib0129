name: Prepare and publish Ratib 3.6.210 smart guide
on:
  push:
    branches:
      - feature/smart-user-guide
    paths:
      - tools/publish-smart-guide-release-20261117.py
      - .github/workflows/ratib-smart-guide-release-3.6.210.yml
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare release version, notes and offline cache
        run: |
          if [ "$(node -p 'require("./package.json").version')" = "3.6.209" ]; then
            python3 tools/publish-smart-guide-release-20261117.py
          fi
          node -e 'const p=require("./package.json"); if(p.version!=="3.6.210" || !p.scripts.test.includes("test-smart-user-guide.cjs")) process.exit(1)'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify guide and full accounting and interface regressions
        run: npm test
      - name: Verify statement balances
        run: node test-statement-3.6.60.cjs && node test-statement-3.6.79.cjs
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js package.json test-*.cjs
          git diff --cached --quiet || git commit -m "Ratib 3.6.210: smart user guide and release metadata"
          git push origin HEAD:feature/smart-user-guide
      - name: Publish verified release to the official main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=$(git rev-parse HEAD)
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "aab3a6da39f606aac7b71ff8bd70ac2f210223b3"
          test "$(gh pr view 186 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$verified"
          test "$(gh pr view 186 --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefName,state --jq '[.baseRefName,.headRefName,.state]|join(" ")')" = "main feature/smart-user-guide OPEN"
          if [ "$(gh pr view 186 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready 186 --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge 186 --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$verified"
