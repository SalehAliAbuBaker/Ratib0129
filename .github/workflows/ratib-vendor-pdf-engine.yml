name: Vendor pinned PDFMake and Arabic font for direct vector statements
on:
  push:
    branches:
      - feature/ratib-3.6.159-direct-vector-pdf
    paths:
      - tools/prepare-direct-pdf-assets.sh
      - .github/workflows/ratib-vendor-pdf-engine.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate pinned local PDF engine and Tajawal TTF assets
        run: bash tools/prepare-direct-pdf-assets.sh
      - name: Commit generated build assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ratib-pdfmake-0.2.23.min.js vendor/ratib-tajawal-regular.ttf vendor/ratib-tajawal-bold.ttf
          if ! git diff --cached --quiet; then
            git commit -m "build(pdf): vendor offline PDFMake 0.2.23 and Tajawal fonts"
            git push origin "HEAD:feature/ratib-3.6.159-direct-vector-pdf"
          fi
