<style id="ratib-trial-diagnosis-layout">

.trial-overview h3{font-size:1rem;margin:0 0 8px;color:var(--text)}

<style>

.voucher-type-btn{min-height:142px;border:2px solid var(--border)!important;border-radius:16px!important;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--accent) 7%,var(--card)))!important;color:var(--text)!important;display:flex!important;flex-direction:column!important;align-items:center;justify-content:center;gap:9px;padding:12px!important;font:900 1.12rem Tajawal,sans-serif;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}

.form-group{margin-bottom:15px}

.searchable-dropdown{border:1px solid var(--border);box-shadow:0 8px 20px rgba(23,32,51,.14)}
.modal-overlay{backdrop-filter:blur(2px);background:rgba(15,23,42,.55)}

// يقترح الرقم التالي في تسلسل الحساب الأب: كود المجموعة + رقم تسلسلي (مثل 1101 ← 110101، 110102 ...)
function suggestSubAccountCode(targetPath){
  const cat=getCanonicalCatalog();
  const parent=cat.find(x=>catalogSubKey(x)===targetPath);
  if(!parent)return '';
  const prefix=String(parent.subCode||'');
  const free=()=>{let n=900000;while(accountCodeIsUsed(n))n++;return String(n);};
  if(!/^[0-9]{1,5}$/.test(prefix))return free();
  const width=6-prefix.length;let max=0;
  const eat=v=>{
    v=String(v);
    if(v.length===6&&v.startsWith(prefix)){
      const n=Number(v.slice(prefix.length));if(n>max)max=n;
    }
  };
  // التسلسل المقترح يعتمد على الأرقام النشطة فقط؛ لا يحجز رقم حساب محذوف.
  cat.forEach(x=>(x.details||[]).forEach(d=>eat(d[0])));
  let n=max+1;
  while(n<Math.pow(10,width)&&accountCodeIsUsed(prefix+String(n).padStart(width,'0')))n++;
  return n<Math.pow(10,width)?prefix+String(n).padStart(width,'0'):free();
}
// الحساب الرئيسي: تحت أب (1 ← 11 ← 12) أو مستقل (رقم مستوى أول جديد)
function suggestParentCategoryCode(parentPath){
  const cat=getCanonicalCatalog(),parts=String(parentPath||'').split('|||');
  let prefix='',width=1;
  if(parts[0]==='main'){
    prefix=String(cat.find(x=>x.main===parts[1])?.mainCode||'');
  }else if(parts[0]==='group'){
    prefix=String(cat.find(x=>x.main===parts[1]&&x.group===parts[2])?.groupCode||'');
    width=2;
  }
  if(/^[0-9]+$/.test(prefix)){
    for(let n=1;n<Math.pow(10,width);n++){
      const proposed=prefix+String(n).padStart(width,'0');
      if(!accountCodeIsUsed(proposed))return proposed;
    }
  }
  let max=0;
  cat.forEach(x=>{const m=Number(x.mainCode);if(Number.isFinite(m))max=Math.max(max,m);});
  let n=max+1;while(accountCodeIsUsed(n))n++;
  return String(n);
}

function initVoucherCategoryStates(amount = 0) {
  const cats = getCats(); voucherCatStates = {}; voucherCatsExpanded = false;
  cats.forEach(c => voucherCatStates[c.id] = { enabled: c.id === 'general', amount: 0, pct: c.id === 'general' ? 100 : 0 });
  if (amount > 0) recalcAmountsFromPcts(amount); else renderVoucherCategoriesList();
}

function recalcAmountsFromPcts(totalAmount) {
  const cats = getCats(), activeCats = cats.filter(c => voucherCatStates[c.id]?.enabled);
  const activeWeight = activeCats.reduce((s, c) => s + (voucherCatStates[c.id]?.pct || 0), 0);
  let allocated = 0;
  cats.forEach(c => {
    if (!voucherCatStates[c.id]?.enabled || activeWeight === 0) { voucherCatStates[c.id].amount = 0; }
    else {
      const ratio = voucherCatStates[c.id].pct / activeWeight, catAmt = Math.round(totalAmount * ratio);
      voucherCatStates[c.id].amount = catAmt;
      voucherCatStates[c.id].pct = ratio * 100;
      allocated += catAmt;
    }
  });
  const diff = totalAmount - allocated;
  if (diff !== 0 && activeCats.length > 0) voucherCatStates[activeCats[0].id].amount += diff;
  renderVoucherCategoriesList();
}

function renderVoucherCategoriesList() {
  if (!isVoucherSplitActive) return;
  const cats = getCats(), container = document.getElementById('voucherCatsList');
  container.innerHTML = '';
  const totalAmount = getCleanNumber(document.getElementById('voucherAmountInput').value);

  let hiddenCats = 0;
  cats.forEach(c => {
    const st = voucherCatStates[c.id] || { enabled: true, amount: 0, pct: c.pct || 0 };
    if (!voucherCatsExpanded && c.id !== 'general' && !st.enabled) { hiddenCats++; return; }
    const row = document.createElement('div'); row.className = `voucher-cat-row ${st.enabled ? '' : 'disabled'}`;
    let inputHtml = voucherSplitMode === 'pct' ? 
      `<div class="voucher-cat-input-wrap"><input type="number" class="voucher-cat-pct-input" data-id="${c.id}" value="${st.pct}" ${st.enabled ? '' : 'disabled'}><span style="font-weight:700;">%</span><span style="color:var(--muted); font-weight:700; min-width:65px; text-align:left;">(${Number(st.amount || 0).toLocaleString()} • ${Number(st.pct || 0).toFixed(2)}%)</span></div>` :
      `<div class="voucher-cat-input-wrap"><input type="number" class="voucher-cat-amt-input" data-id="${c.id}" value="${st.amount || 0}" ${st.enabled ? '' : 'disabled'}><span style="color:var(--muted); font-weight:700; min-width:35px; text-align:left;">(${st.pct || 0}%)</span></div>`;

    row.innerHTML = `<div class="voucher-cat-name" title="${esc(c.description || 'اضغط لعرض شرح البند')}"><button type="button" class="toggle-vis-btn toggle-v-cat" data-id="${c.id}">${st.enabled ? '👁️' : '🔄'}</button><span class="cat-color" style="background:${c.color}"></span><button type="button" class="cat-help-btn" data-id="${c.id}">${esc(c.name)} <small>ⓘ</small></button></div>${inputHtml}`;
    row.querySelector('.cat-help-btn').addEventListener('click', () => showToast(c.description || 'بند الميزانية المحدد', 'success'));
    row.querySelector('.toggle-v-cat').addEventListener('click', () => {
      st.enabled = !st.enabled; st.amount = st.enabled ? st.amount : 0; st.pct = st.enabled ? (c.pct || 10) : 0;
      if (voucherSplitMode === 'pct') recalcAmountsFromPcts(totalAmount); else renderVoucherCategoriesList();
    });
    if (voucherSplitMode === 'pct') {
      row.querySelector('.voucher-cat-pct-input').addEventListener('input', (e) => { st.pct = parseFloat(e.target.value) || 0; recalcAmountsFromPcts(totalAmount); });
    } else {
      row.querySelector('.voucher-cat-amt-input').addEventListener('input', (e) => {
        st.amount = parseFloat(e.target.value) || 0;
        if (totalAmount > 0) st.pct = Math.round((st.amount / totalAmount) * 100);
        updateVoucherSummaryNumbers();
      });
    }
    container.appendChild(row);
  });
  makeCatsExpandToggle(container, hiddenCats, voucherCatsExpanded, () => { voucherCatsExpanded = !voucherCatsExpanded; renderVoucherCategoriesList(); });
  updateVoucherSummaryNumbers();
}

function updateVoucherSummaryNumbers() {
  const totalAmount = getCleanNumber(document.getElementById('voucherAmountInput').value);
  let totalAllocated = 0, totalPcts = 0;
  Object.values(voucherCatStates).forEach(st => { if (st.enabled) { totalAllocated += Number(st.amount || 0); totalPcts += Number(st.pct || 0); } });
  const remaining = totalAmount - totalAllocated;
  document.getElementById('voucherAllocatedSum').textContent = totalAllocated.toLocaleString();
  document.getElementById('voucherAllocatedPctSum').textContent = `${Number(totalPcts).toFixed(2)}%`;
  const remEl = document.getElementById('voucherRemainingSum');
  remEl.textContent = remaining.toLocaleString();
  remEl.style.color = remaining === 0 ? 'var(--ok)' : (remaining > 0 ? 'var(--warn)' : 'var(--danger)');
  document.getElementById('voucherSplitContainer').classList.toggle('balanced', remaining === 0 && totalAmount > 0);
}

function buildSimpleVoucherData(status='draft'){
  if(currentVoucherMode!=='entry')throw Error('استخدم سند القبض والصرف الموحد.');
  const totalAmount = getCleanNumber(document.getElementById('voucherAmountInput').value);
  const debitAcc = selDebitAcc.getValue(), creditAcc = selCreditAcc.getValue();
  const voucherCur = document.getElementById('voucherCurrencySelect').value, note = document.getElementById('voucherNoteInput').value.trim();
  const recipient = document.getElementById('voucherRecipientInput').value.trim();
  const dateVal = document.getElementById('voucherDateInput').value || getLocalTodayISO();

  if (!Number.isFinite(totalAmount) || totalAmount <= 0) throw Error('يرجى إدخال مبلغ صحيح');
  if (!debitAcc || !creditAcc) throw Error('يجب تحديد الحساب المدين والدائن');

  const finalDist = {}, initialExecution = {};
  let totalAllocated = 0;
  getCats().forEach(c => {
    const st = voucherCatStates[c.id];
    if (isVoucherSplitActive && st && st.enabled && st.amount > 0) {
      totalAllocated += Number(st.amount);
      finalDist[c.id] = { id: c.id, name: c.name, amount: st.amount, pct: totalAmount > 0 ? (Number(st.amount) / totalAmount) * 100 : 0, color: c.color, excluded: false };
      initialExecution[c.id] = { done: true, actualSpent: st.amount, note: note || '' };
    }
  });
  if (totalAllocated === 0) {
    const general = getCats().find(c => c.id === 'general') || getCats().find(c => c.id === 'center');
    if (!general) throw Error('لا يمكن تجهيز السند قبل إنشاء بند عام أو المركز.');
    totalAllocated = totalAmount;
    finalDist[general.id] = { id: general.id, name: general.name, amount: totalAmount, pct: 100, color: general.color, excluded: false };
    initialExecution[general.id] = { done: true, actualSpent: totalAmount, note: note || '' };
  }
  if (Math.abs(totalAllocated - totalAmount) > 0.001) throw Error(`مجموع توزيع الميزانية (${totalAllocated.toLocaleString()}) لا يساوي إجمالي السند (${totalAmount.toLocaleString()}).`);

  const assignedSeqNum = getNextVoucherNumber(currentVoucherMode);
  const tx = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2)}`,
    seqNum: assignedSeqNum, timestamp: new Date(dateVal).getTime(), isoDate: dateVal, date: dateVal,
    amount: totalAmount, currency: voucherCur, isExpense: false, voucherMode: currentVoucherMode,
    debitAccount: debitAcc, creditAccount: creditAcc, debitAccountId:selDebitAcc.getAccountId(),creditAccountId:selCreditAcc.getAccountId(), recipient: recipient || '',
    type: `سند قيد #${assignedSeqNum}`,
    distribution: finalDist, execution: initialExecution, status, schemaVersion: APP_SCHEMA_VERSION, updatedAt: new Date().toISOString()
  };

  const errs = validateTransaction(tx); if (errs.length) throw Error(errs.join('\n'));
  return tx;
}

// بتأكيد بسيط، وحذف سند قيد مركب بالكامل (كل بنوده) من نافذة تفاصيل المستند بتأكيد مكتوب.
function reverseTransactionById(itemId) {
  const p = getMasterPlan();
  let tx = (p.transactions || []).find(t => String(t.id) === String(itemId));
  let inPlan = true;
  if (!tx) {
    const history = store.get('history', []);
    for (const h of history) {
      if (Array.isArray(h.transactions)) {
        tx = h.transactions.find(t => String(t.id) === String(itemId));
        if (tx) { inPlan = false; break; }
      }
    }
  }
  if (!tx) return false;
  if(tx.commerceId){showToast('المستند التجاري مرتبط بالمخزون؛ التصحيح يكون بمرتجع أو تسوية داخل القسم التجاري، ولا يجوز إلغاء بند القيد وحده.','warn');return false;}
  const before = structuredClone(tx);
  tx.status = 'reversed';
  tx.reversedAt = new Date().toISOString();
  tx.updatedAt = new Date().toISOString();
  if (inPlan) { store.set('plan', p); } else { store.set('history', store.get('history', [])); }
  audit('REVERSE_TRANSACTION', tx.id, before, tx);
  return true;
}

function recalcEditAmountsFromPcts(totalAmount) {
  const cats = getCats(), activeCats = cats.filter(c => editVoucherCatStates[c.id]?.enabled);
  const activeWeight = activeCats.reduce((s, c) => s + (editVoucherCatStates[c.id]?.pct || 0), 0);
  let allocated = 0;
  cats.forEach(c => {
    if (!editVoucherCatStates[c.id]?.enabled || activeWeight === 0) {
      editVoucherCatStates[c.id].amount = 0;
    } else {
      const ratio = editVoucherCatStates[c.id].pct / activeWeight, catAmt = Math.round(totalAmount * ratio);
      editVoucherCatStates[c.id].amount = catAmt;
      editVoucherCatStates[c.id].pct = ratio * 100;
      allocated += catAmt;
    }
  });
  const diff = totalAmount - allocated;
  if (diff !== 0 && activeCats.length > 0) editVoucherCatStates[activeCats[0].id].amount += diff;
  renderEditVoucherCategoriesList();
}

function renderEditVoucherCategoriesList() {

    if (!editVoucherCatsExpanded && c.id !== 'general' && !st.enabled) { hiddenEditCats++; return; }
    const row = document.createElement('div'); row.className = `voucher-cat-row ${st.enabled ? '' : 'disabled'}`;
    
    let inputHtml = editVoucherSplitMode === 'pct' ? 
      `<div class="voucher-cat-input-wrap"><input type="number" class="voucher-cat-pct-input edit-cat-pct-input" data-id="${c.id}" value="${st.pct}" ${st.enabled ? '' : 'disabled'}><span style="font-weight:700;">%</span><span style="color:var(--muted); font-weight:700; min-width:65px; text-align:left;">(${Number(st.amount || 0).toLocaleString()} • ${Number(st.pct || 0).toFixed(2)}%)</span></div>` :
      `<div class="voucher-cat-input-wrap"><input type="number" class="voucher-cat-amt-input edit-cat-amt-input" data-id="${c.id}" value="${st.amount || 0}" ${st.enabled ? '' : 'disabled'}><span style="color:var(--muted); font-weight:700; min-width:35px; text-align:left;">(${st.pct || 0}%)</span></div>`;

    row.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.05rem; flex:1;">
        <button type="button" class="toggle-vis-btn toggle-edit-cat" data-id="${c.id}" style="background:none; border:none; cursor:pointer;">${st.enabled ? '👁️' : '🔄'}</button>
        <span class="cat-color" style="background:${c.color}; width:16px; height:16px; border-radius:4px; display:inline-block;"></span>
        <span>${esc(c.name)}</span>
      </div>
      ${inputHtml}
    `;

    row.querySelector('.toggle-edit-cat').addEventListener('click', () => {
      st.enabled = !st.enabled;
      st.amount = st.enabled ? st.amount : 0;
      st.pct = st.enabled ? (c.pct || 10) : 0;
      if (editVoucherSplitMode === 'pct') recalcEditAmountsFromPcts(totalAmount);
      else renderEditVoucherCategoriesList();
    });

    if (editVoucherSplitMode === 'pct') {
      row.querySelector('.edit-cat-pct-input').addEventListener('input', (e) => {
        st.pct = parseFloat(e.target.value) || 0;
        recalcEditAmountsFromPcts(totalAmount);
      });
    } else {
      row.querySelector('.edit-cat-amt-input').addEventListener('input', (e) => {
        st.amount = parseFloat(e.target.value) || 0;
        if (totalAmount > 0) st.pct = Math.round((st.amount / totalAmount) * 100);
        updateEditVoucherSummaryNumbers();
      });
    }
    container.appendChild(row);
  });
  makeCatsExpandToggle(container, hiddenEditCats, editVoucherCatsExpanded, () => { editVoucherCatsExpanded = !editVoucherCatsExpanded; renderEditVoucherCategoriesList(); });
  updateEditVoucherSummaryNumbers();
}

// يجمع كل بنود سند القيد المركب (مخزَّنة كعمليات منفصلة تشترك في multiVoucherId، كل بند
// يحمل إما حساب مدين أو دائن فقط) في "بطاقة" منطقية واحدة تمثّل السند بالكامل — بدل عرض كل
// بند كعملية مستقلة، وهو ما كان يُظهر السند مرتين (مرة لسطر المدين ومرة لسطر الدائن) ويُضاعف
// المبلغ المعروض في الإجماليات. تُستخدم هذه الدالة في شاشة "السجل".
function entrygroupLedgerItemsForDisplay(txs){
  const groups=new Map();
  for(const t of txs){if(t.isMultiVoucher){const id=t.multiVoucherId||t.id;if(!groups.has(id))groups.set(id,[]);groups.get(id).push(t);}}
  const seen=new Set(),out=[];
  for(const item of txs){
    if(!item.isMultiVoucher){out.push(item);continue;}
    const groupId=item.multiVoucherId||item.id;if(seen.has(groupId))continue;seen.add(groupId);
    const lines=groups.get(groupId),debitNames=[...new Set(lines.map(t=>t.debitAccount).filter(Boolean))],creditNames=[...new Set(lines.map(t=>t.creditAccount).filter(Boolean))];
    const amount=item.multiVoucher?.baseTotal||lines.filter(t=>t.debitAccount).reduce((sum,t)=>sum+Number(t.amount||0),0);
    out.push({...item,debitAccount:debitNames.join('، ')||'-',creditAccount:creditNames.join('، ')||'-',amount,_groupId:groupId,_siblingCount:lines.length});
  }
  return out;
}

  let txs = groupLedgerItemsForDisplay(allTxs).sort((a,b)=>{

// Match account-list suggestions and completion to the accounting selectors.
function accountsPagerCandidates(query){
  const q=normalizeParentQuery(query||'');if(!q)return [];
  const found=[],seen=new Set();
  const simpleMode=window.RatibSimpleAccounts?.isSimple?.()===true;
  getCanonicalCatalog().forEach(parent=>parent.details.forEach(d=>{
    const code=String(d[0]||''),name=String(d[1]||''),key=code+'|'+name;
    if(seen.has(key))return;
    const category=window.RatibSimpleAccounts?.groupOf(parent);
    if(simpleMode&&!category)return;
    seen.add(key);
    const group=simpleMode?category.label:parent.main+' > '+parent.group+' > '+parent.sub;
    if(ratibAccountSearchMatch([name,code,group].join(' '),q))found.push({code,name,group});
  }));
  return found;
}
function initAccountsPagerAutocomplete(){
  const input=document.getElementById('accountsPagerSearchInput'),popup=document.getElementById('accountsPagerSuggestions');
  if(!input||!popup||input.dataset.autoBound)return;
  input.dataset.autoBound='1';let timer=0,visible=[],active=0,composing=false;
  const hide=()=>{popup.hidden=true;popup.innerHTML='';input.setAttribute('aria-expanded','false');};
  const choose=item=>{if(!item)return;clearTimeout(timer);input.value=item.name;hide();renderAccountsPager();input.focus();input.setSelectionRange(input.value.length,input.value.length);};
  const render=()=>{
    const query=input.value.trim();visible=accountsPagerCandidates(query);active=0;
    if(!query||!visible.length){hide();return;}
    popup.innerHTML='';
    visible.slice(0,20).forEach((item,i)=>{
      const option=document.createElement('button');option.type='button';option.className='accounts-pager-suggestion'+(i===0?' active':'');option.setAttribute('role','option');option.setAttribute('aria-selected',i===0?'true':'false');
      option.textContent=item.name+' ['+item.code+']';
      const meta=document.createElement('small');meta.textContent=item.group;option.appendChild(meta);

    const plan=store.get('plan',null),history=store.get('history',[]),containers=[];

    const byVoucher=new Map();
    containers.forEach(c=>c.ref.transactions.forEach(t=>{if(!t||!t.isMultiVoucher||!t.multiVoucherId)return;const arr=byVoucher.get(t.multiVoucherId)||[];arr.push({t,c});byVoucher.set(t.multiVoucherId,arr);}));

      if(new Set(list.map(x=>x.c.key)).size<2)return;
      const max=Math.max(...list.map(x=>Number(x.t.updatedAt)||0));
      list.forEach(x=>{if((Number(x.t.updatedAt)||0)<max)drop.add(x.t);});

/* Ratib trial 3.6.109 — preserve the active screen across Android/PWA background recreation.
 * The view is stored in Ratib's existing protected application store, not in plain localStorage.
 * Never restore before vault unlock; explicit Exit clears the snapshot.
 */
const RATIB_RESUME_VIEW_KEY='ratib_ui_resume_view_v1';
let _ratibResumeListenersReady=false;
let _ratibResumeRestored=false;
let _ratibResumeSaveTimer=null;
function ratibRememberBackgroundView(){
  if(!window.__ratibProceedInitialized||_appExited||_exitPromise||_restoringAppView||window.RatibFirstRunSetup?.isActive?.())return;
  try{
    const lock=document.getElementById('lockScreen');
    if(lock?.style.display==='flex')return;
    const view=captureAppView();
    if(!view||!TABS_ORDER.includes(view.tab))return;
    // Keyboard focus and transient dropdowns are not part of the restored document state.
    view.focusId=null;view.openDropdowns=[];
    store.set(RATIB_RESUME_VIEW_KEY,{format:1,savedAt:Date.now(),view});
  }catch(error){console.warn('Ratib background screen snapshot:',error);}
}
function ratibRestoreBackgroundView(){
  if(_ratibResumeRestored||window.RatibFirstRunSetup?.isActive?.())return;
  _ratibResumeRestored=true;
  let saved=null;
  try{saved=store.get(RATIB_RESUME_VIEW_KEY,null);}catch(error){console.warn('Ratib screen state read:',error);return;}
  if(!saved||saved.format!==1||!saved.view||!TABS_ORDER.includes(saved.view.tab))return;
  try{
    restoreAppView(saved.view);
    // Restoring the selection alone is not sufficient: render its financial statement.
    if(saved.view.tab==='pageReports'&&saved.view.reportSection==='statement'){
      const selected=selReportAccount?.getValue();
      if(selected&&selected!=='ALL'||!window.RatibSimpleAccounts?.isSimple?.())runAccountStatement();
    }
    requestAnimationFrame(()=>window.scrollTo({top:Number(saved.view.scrollY)||0,behavior:'instant'}));
  }catch(error){
    console.warn('Ratib background screen restore:',error);
    // Leave the accounting data and protected vault untouched if a view is obsolete.
  }
}
function ratibBindBackgroundView(){
  if(_ratibResumeListenersReady)return;_ratibResumeListenersReady=true;
  const save=()=>{clearTimeout(_ratibResumeSaveTimer);_ratibResumeSaveTimer=null;ratibRememberBackgroundView();};
  const persist=()=>{save();flushStorage().catch(()=>{});};
  const defer=()=>{if(_appExited||_exitPromise)return;clearTimeout(_ratibResumeSaveTimer);_ratibResumeSaveTimer=setTimeout(save,350);};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
  window.addEventListener('pagehide',persist);
  document.addEventListener('click',defer,true);
  document.addEventListener('change',defer,true);
  document.addEventListener('input',defer,true);
  window.addEventListener('scroll',defer,{passive:true});
}

//   أي أثر لبياناتك مفكوك الشفرة في الصفحة أو الذاكرة بعد الخروج.

function performRealExit(){
  if(_exitPromise)return _exitPromise;if(_appExited)return Promise.resolve(true);
  allowExit=false;
  const controls=[...document.querySelectorAll('input,select,textarea,button')].map(element=>({element,disabled:element.disabled}));controls.forEach(({element})=>{element.disabled=true;});
  const buttons=[...document.querySelectorAll('#confirmExitAppBtn,#exitAppBtn,[data-sidebar-action="exit"]')];
  buttons.forEach(button=>{button.disabled=true;button.dataset.exitLabel=button.innerHTML;button.textContent='جارٍ الحفظ والخروج…';});
  hideExitModal();const progress=document.getElementById('exitProgressModal');progress?.classList.add('show');progress?.focus({preventScroll:true});
  _exitPromise=(async()=>{
    try{
      if(_pendingFinancialCompletion){await flushStorage();const after=_pendingFinancialCompletion;_pendingFinancialCompletion=null;after?.();}
      clearTimeout(_draftTimer);_draftTimer=null;
      if(currentActiveTab==='pageExpenses'){
        if(!document.getElementById('multiVoucherCard')?.classList.contains('hidden')&&multiVoucherLines.some(line=>!line.autoBalance&&(line.account||line.amount||line.note))){
          const draft=buildMultiVoucherData('draft');store.set('multi_voucher_drafts',[...store.get('multi_voucher_drafts',[]).filter(item=>item.id!==draft.id),draft]);
        }else if(!document.getElementById('cashFlowCard')?.classList.contains('hidden')){const draft=captureSingleDraft();if(draft.amount||draft.note||draft.recipient)store.set('single_voucher_draft_v1',draft);}
      }
      store.remove(RATIB_RESUME_VIEW_KEY);
      await flushStorage();const cfg=getSecurityConfig();
      clearTimeout(_draftTimer);clearTimeout(_reminderTimer);clearTimeout(_autoBackupTimer);clearTimeout(_storageTimer);
      _vaultCryptoKey=null;_vaultUnlocked=false;for(const key of Object.keys(_memStore))delete _memStore[key];
      try{sessionStorage.removeItem(SESSION_KEY_CACHE);}catch(_){ }
      hasUnsavedChanges=false;allowExit=true;_appExited=true;_appBackStack.length=0;_appSavedViews.clear();
      showExitedScreen(cfg.enabled);
      let nativeExit=false;
      if(typeof navigator.app?.exitApp==='function'){try{navigator.app.exitApp();nativeExit=true;}catch(_){ }}
      if(!nativeExit){try{window.close();}catch(_){ }if(!window.closed&&_appHistoryInitialized&&history.state?.ratibGuard){if(_appExitHistoryDelta===-2)history.go(-2-Number(history.state.ratibDepth||0));else history.back();}}
      return true;
    }catch(_){
      allowExit=false;document.getElementById('exitProgressModal')?.classList.remove('show');
      controls.forEach(({element,disabled})=>{element.disabled=disabled;});buttons.forEach(button=>{button.innerHTML=button.dataset.exitLabel;delete button.dataset.exitLabel;});
      document.getElementById('retryStorageBtn')?.focus({preventScroll:true});showToast('لم يكتمل الحفظ؛ بقي التطبيق مفتوحاً. أعد محاولة الحفظ ثم الخروج.','error',7000);return false;
    }
  })();
  const pending=_exitPromise;pending.then(result=>{if(!result&&_exitPromise===pending)_exitPromise=null;});return pending;
}

function isValidISODate(text){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(text||'')))return false;
  const [year,month,day]=text.split('-').map(Number),date=new Date(`${text}T12:00:00Z`);
  return year>=1900&&year<=9999&&date.getUTCFullYear()===year&&date.getUTCMonth()+1===month&&date.getUTCDate()===day;
}

function roundAccountingAmount(value,currency='YER'){const digits=window.RatibCountryCurrency?.digits?.(currency)??2;const factor=10**Math.max(0,Math.min(4,digits));return Math.round((Number(value)+Number.EPSILON)*factor)/factor;}

function dashboardTransactions(){
  let txs=effectiveTransactions(),period=document.getElementById('dashboardPeriod')?.value||'all';
  if(period==='current')txs=txs.filter(t=>String(t.isoDate||'').startsWith(monthKey()+'-'));
  return txs;
}

function collectBudgetRows(txs,cats,currency){
  const summary=Object.fromEntries(cats.map(c=>[c.id,{id:c.id,name:c.name,color:c.color,allocated:0,actualSpent:0,transactions:[]}]))
  for(const t of txs){
    if(t.status==='reversed'||t.status==='deleted'||t.currency!==currency)continue;
    // Each debit line keeps its original budget allocation; its matching credit line is not a second expense.
    if(t.isMultiVoucher&&(t.multiVoucher?.mode==='income'?!t.creditAccount:!t.debitAccount))continue;
    for(const [cid,d] of Object.entries(t.distribution||{})){
      if(!summary[cid]||d.excluded)continue;
      const allocated=Number(d.amount||0),spent=t.execution?.[cid]?.actualSpent!==undefined?Number(t.execution[cid].actualSpent):(t.voucherMode==='income'?0:(t.isExpense?Number(t.amount||0):allocated));
      if(!Number.isFinite(allocated)||!Number.isFinite(spent))continue;
      summary[cid].allocated+=allocated;summary[cid].actualSpent+=spent;summary[cid].transactions.push({...t,assignedAmount:allocated});
    }
  }
  for(const row of Object.values(summary)){row.allocated=roundAccountingAmount(row.allocated);row.actualSpent=roundAccountingAmount(row.actualSpent);}
  return summary;
}

function loadLocalScript(src){

  const p=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>{s.remove();_scriptLoads.delete(src);reject(new Error('تعذر تحميل مورد التطبيق'));};document.head.append(s);});

}

function validateRestoredData(data){
  if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('محتوى النسخة الاحتياطية غير صالح.');
  const plan=data[APP_STORAGE_PREFIX+'plan'],history=data[APP_STORAGE_PREFIX+'history'];
  if(plan&&(!Array.isArray(plan.transactions)||typeof plan.month!=='string'))throw new Error('صيغة دفتر العمليات غير صالحة.');
  if(history&&!Array.isArray(history))throw new Error('صيغة الأرشيف غير صالحة.');
  const txs=[...(plan?.transactions||[]),...(history||[]).flatMap(h=>{if(!Array.isArray(h.transactions))throw new Error('إحدى دورات الأرشيف غير صالحة.');return h.transactions;})];
  for(const tx of txs){
    if(!tx||typeof tx!=='object'||!Number.isFinite(Number(tx.amount))||Number(tx.amount)<0)throw new Error('توجد عملية بمبلغ غير صالح في النسخة.');
    if(tx.isoDate&&!isValidISODate(tx.isoDate))throw new Error('توجد عملية بتاريخ غير صالح في النسخة.');
    if(tx.currency&&!(KNOWN_CURRENCIES.has(tx.currency)||(/^[A-Z]{3}$/.test(tx.currency)&&(data.masar_import_currencies||[]).includes(tx.currency))))throw new Error('توجد عملة غير مدعومة في النسخة.');
    if(tx.isMultiVoucher&&tx.multiVoucher?.lines){if(!Array.isArray(tx.multiVoucher.lines))throw new Error('صيغة أسطر القيد المركب غير صالحة.');}
  }
  return txs.length;
}

async function shareRatibDocumentFile(file,title){
  // PDF sharing is not supported or permitted in every mobile/browser environment.
  // Preserve the already generated file; offer a local download instead of losing it.
  const saveForManualShare=()=>{
    try{
      downloadFinancialFile(file,ratibStatementText(file?.name,'راتب-تقرير.pdf'));
      showToast('المشاركة المباشرة غير متاحة؛ تم تنزيل ملف PDF. يمكنك مشاركته من التنزيلات.','info',8000);
    }catch(downloadError){
      console.error('Ratib share fallback download failed',downloadError);
      showToast('تعذّرت المشاركة والتنزيل؛ يرجى استخدام زر تنزيل PDF أو متصفح آخر.','error',8000);
    }
    return false;
  };
  let supported=false;
  try{
    supported=typeof navigator.share==='function' &&
      (!navigator.canShare || navigator.canShare({files:[file]}));
  }catch(checkError){console.warn('Ratib file sharing check failed',checkError);}
  if(!supported)return saveForManualShare();
  try{await navigator.share({title,files:[file]});return true;}
  catch(error){
    if(error?.name==='AbortError')return false; // User canceled the share sheet.
    console.warn('Ratib native share failed; saving PDF instead',error);
    return saveForManualShare();
  }
}

    if(!ratibGestureDraftCheck()){

      const steps=known?_appCurrentHistoryDepth-depth:1;

  if(known&&depth!==_appCurrentHistoryDepth){
    const view=_appSavedViews.get(depth)||_appBackStack[depth];
    if(view){_appBackStack.length=0;for(let i=0;i<depth;i++){const previous=_appSavedViews.get(i);if(previous)_appBackStack.push(previous);}_appCurrentHistoryDepth=depth;restoreAppView(view);finishAppHistoryMovement();return;}

function syncMultiAutoBalance(){
  if(!cashVoucherMode())return entrysyncMultiAutoBalance();
  const lines=multiVoucherLines.filter(l=>!l.autoBalance);let total=0;
  for(const line of lines){line.side=cashCounterSide();if(line.currency===spendBase())line.rate=1;const value=spendAmount(line);line.base=Number.isFinite(value)?value:0;line.equivalentAmount=line.base;line.equivalentCurrency=spendBase();if(value>0)total=spendRound(total+value);}
  multiVoucherLines=[...lines,{...newMultiLine(),autoBalance:true,side:multiVoucherMode==='income'?'debit':'credit',currency:spendBase(),account:multiSourceAcc.getValue(),accountId:multiSourceAcc.getAccountId()||'',amount:total,rate:1,base:total,budgetId:'general',note:document.getElementById('multiVoucherNote').value.trim()||cashSourceLabel()}];
}

function updateMultiVoucherSummary(){
  if(!cashVoucherMode())return entryupdateMultiVoucherSummary();
  const base=spendBase(),totals={},lines=multiVoucherLines.filter(l=>!l.autoBalance);let total=0,invalid=false;
  for(const line of lines){const amount=getCleanNumber(line.amount),rate=multiLineRate(line,base),value=spendAmount(line);if(!Number.isFinite(amount)||amount<0||!Number.isFinite(rate)||rate<=0||!Number.isFinite(value))invalid=true;
    if(Number.isFinite(amount)&&amount>0)totals[line.currency]=spendRound((totals[line.currency]||0)+amount,line.currency);
    if(Number.isFinite(value)&&value>0)total=spendRound(total+value);
    const index=multiVoucherLines.indexOf(line),cell=document.querySelector(`.multi-line-base[data-index="${index}"]`);if(cell)cell.textContent=Number.isFinite(value)&&rate>0?fmt(value,base):'حدد سعر الصرف';
  }
  syncSpendSequence();const head=document.getElementById('spendEquivalentHead');if(head)head.textContent=`القيمة المعادلة (${base})`;
  document.getElementById('multiVoucherSummary').innerHTML=Object.entries(totals).map(([currency,value])=>`<span>${esc(accountCurrencyLabel(currency))}: <b>${fmt(value,currency)}</b></span>`).join('')+`<strong>الإجمالي بعملة ${cashSourceLabel()}: ${invalid?'—':fmt(total,base)}</strong>`;
  const balanced=!invalid&&total>0&&!!multiSourceAcc.getValue(),balance=document.getElementById('multiVoucherBalance');balance.dataset.base=String(total);balance.className='multi-voucher-balance '+(balanced?'balanced':'unbalanced');balance.textContent=balanced?(multiVoucherMode==='income'?'القيد متوازن — الحساب المدين هو حساب القبض':'القيد متوازن — الحساب الدائن هو حساب الصرف'):invalid?'راجع المبالغ ومعادلة الصرف':'اختر '+cashSourceLabel()+' وأكمل البنود';
  const typedTopAmount=getCleanNumber(document.getElementById('ratibHeaderAmount')?.value);document.getElementById('spendTafqit').textContent=Number.isFinite(typedTopAmount)&&typedTopAmount>0?tafqitAccountCurrency(typedTopAmount,base):'';
  const mixed=lines.some(l=>l.currency!==base);document.getElementById('spendFxHeader').classList.toggle('hidden',!mixed);document.getElementById('spendFxButton').classList.toggle('hidden',!mixed);
  const first=lines.find(l=>l.currency!==base);document.getElementById('spendFxHeaderButton').textContent=first&&multiLineRate(first,base)>0?spendFxRelation(first,base):'تحديد سعر الصرف';
  return {base,baseTotal:total,debitTotal:total,creditTotal:total,totals,balanced,invalid};
}

function validateMultiVoucher(){
  if(!cashVoucherMode())return entryvalidateMultiVoucher();
  if(!isValidISODate(document.getElementById('multiVoucherDate').value))return 'أدخل تاريخاً صحيحاً للسند.';
  if(!KNOWN_CURRENCIES.has(spendBase()))return 'اختر عملة الحساب العلوي.';
  const accounts=new Set(getMultiAccountItems().map(x=>x.id)),cats=new Set(getCats().map(x=>x.id)),source=multiSourceAcc.getValue();
  if(!source||!accounts.has(source))return 'اختر الحساب العلوي من دليل الحسابات.';
  const lines=multiVoucherLines.filter(l=>!l.autoBalance);
  if(!lines.length)return 'أضف بنداً واحداً على الأقل.';
  for(const line of lines){
    if(!accounts.has(line.account))return 'اختر حسابًا موجودًا في دليل الحسابات للبند.';
    const amount=getCleanNumber(line.amount),rate=multiLineRate(line,spendBase()),value=spendAmount(line);
    if(!Number.isFinite(amount)||amount<=0||amount!==spendRound(amount,line.currency))return 'أدخل مبلغاً موجباً بعدد المنازل العشرية المعتمد لهذه العملة.';
    if(!KNOWN_CURRENCIES.has(line.currency)||!Number.isFinite(rate)||rate<=0||!Number.isFinite(value)||value<=0||value>Number.MAX_SAFE_INTEGER/100)return 'راجع العملة وسعر الصرف؛ يجب أن تكون المعادلة موجبة وصحيحة.';
    if(!cats.has(line.budgetId))return 'اختر بند ميزانية مسجلاً لكل بند.';
  }
  syncMultiAutoBalance();const sum=updateMultiVoucherSummary();
  if(!sum.balanced||sum.baseTotal>Number.MAX_SAFE_INTEGER/100)return 'لا يمكن حفظ سند غير متوازن أو إجمالي يتجاوز الدقة الآمنة.';
  return entryvalidateMultiVoucher();
}

function spendFxPair(currency,base){return [currency,base].sort();}

function spendFxDefinition(line,base){
  if(line.currency===base)return null;
  const pair=spendFxPair(line.currency,base);
  if(pair.includes(line.fxUnitCurrency)&&pair.includes(line.fxQuoteCurrency)&&line.fxUnitCurrency!==line.fxQuoteCurrency)
    return {unit:line.fxUnitCurrency,counter:line.fxQuoteCurrency,quote:line.fxQuote};
  if(line.fxQuote!==undefined&&['multiply','divide'].includes(line.fxOp))return {unit:line.fxOp==='divide'?base:line.currency,counter:line.fxOp==='divide'?line.currency:base,quote:line.fxQuote};

}

  const docs=getAllTransactions().filter(t=>t.isMultiVoucher&&t.status!=='reversed'&&t.status!=='deleted').sort((a,b)=>new Date(b.multiVoucher?.updatedAt||b.updatedAt||0)-new Date(a.multiVoucher?.updatedAt||a.updatedAt||0));

  return null;
}

/* FX quotations are document-specific. The original amounts are authoritative;
   neither a global current rate nor a rate from another voucher is silently applied. */
function trialSavedFxEvidence(leg,target){
  const from=String(leg.baseCurrency||'');
  if(!from||!target)return {rate:null,reason:'عملة التقييم أو العرض غير محددة'};
  if(from===target)return {rate:1,source:'عملة التقييم المحفوظة'};
  const doc=leg.tx?.multiVoucher;
  const lines=Array.isArray(doc?.lines)&&doc.baseCurrency===from?doc.lines:[];
  const quotes=[],issues=[];
  const add=(rate,source)=>{
    if(Number.isFinite(rate)&&rate>0&&rate<=1e9)quotes.push({rate,source});
  };
  for(let i=0;i<lines.length;i++){
    const l=lines[i];if(!l||typeof l!=='object')continue;
    const source='بند '+(i+1)+' من المستند';
    if(l.currency===target){
      const amount=Number(l.amount);
      const baseAmount=Number(l.equivalentCurrency===from?l.equivalentAmount:l.base);
      const derived=Number.isFinite(amount)&&amount>0&&Number.isFinite(baseAmount)&&baseAmount>0?amount/baseAmount:null;
      const def=spendFxDefinition(l,from),quote=Number(def?.quote);
      const quoted=Number.isFinite(quote)&&quote>0
        ?(def.unit===from&&def.counter===target?quote:def.unit===target&&def.counter===from?1/quote:null):null;
      if(derived!==null&&quoted!==null&&Math.abs(derived-quoted)>Math.max(.000001,Math.abs(derived)*.0001)){
        issues.push('تعارض سعر الصرف مع قيمة المعادل في '+source);continue;
      }
      if(derived!==null)add(derived,'المبلغ والمعادل المحفوظان في '+source);
      else if(quoted!==null)add(quoted,'سعر الصرف المحفوظ في '+source);
    }else if(l.currency===from&&l.equivalentCurrency===target){
      const amount=Number(l.amount),equivalent=Number(l.equivalentAmount);
      if(Number.isFinite(amount)&&amount>0&&Number.isFinite(equivalent)&&equivalent>0)
        add(equivalent/amount,'المبلغ والمعادل المحفوظان في '+source);
    }
  }

  if(!quotes.length)return {rate:null,reason:'لم يُحفظ تحويل من '+from+' إلى '+target+' في المستند نفسه'};
  const first=quotes[0];
  if(quotes.some(q=>Math.abs(q.rate-first.rate)>Math.max(.000001,Math.abs(first.rate)*.0001)))
    return {rate:null,reason:'أسعار تحويل مختلفة داخل المستند؛ لا يمكن اعتماد سعر موحد تلقائيًا'};

}

/* Report-only historical currency-settings reference: future/undated quotes are never reused. */
function trialDatedCurrencyReference(leg,target){

  const rate=Number(x?.reportRateYer),stamp=String(x?.reportRateYerUpdatedAt||'').slice(0,10);

function trialFxRateEvidence(leg,target,method='approved'){
